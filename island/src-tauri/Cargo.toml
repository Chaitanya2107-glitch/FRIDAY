[package]
name = "friday-island"
version = "0.1.0"
description = "FRIDAY's quiet desktop companion"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
url = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
png = "0.17"
winreg = "0.56"
windows = { version = "0.62", features = ["Media_Control", "Win32_System_WinRT", "Win32_System_Power", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation", "Win32_Graphics_Gdi"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading",
  "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_System_Environment"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
